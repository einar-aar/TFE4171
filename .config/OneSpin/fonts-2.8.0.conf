<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts-2.8.0.dtd">
<!-- /etc/fonts/fonts.conf file to configure system font access -->
<!-- Version delivered by OneSpin Solutions.
	Keep the following line intact:
	ONESPIN_FONTS_CONF_VERSION=2
 -->
<fontconfig>
	<!--
		Fonts included in OneSpin 360 distribution
	 -->
	<dir>/eda/tools/siemens/onespin.2024.3_2/onespin/share/fonts/ttf-bitstream-vera-1.10</dir>
	<dir>/eda/tools/siemens/onespin.2024.3_2/onespin/share/fonts/OneSpin</dir>
	<dir>/eda/tools/siemens/onespin.2024.3_2/onespin/share/fonts/dejavu-fonts-ttf-2.37</dir>

	<!--
		Some system fonts.

		This is a very limited but probably safe subset
		of available fonts.
		Enlarging it may lead to a slowdown at startup.
		Some fonts even seem to cause infinite loops.
	 -->
	<!-- Solaris -->
	<dir>/usr/openwin/lib/X11/fonts/TrueType</dir>
	<dir>/usr/openwin/lib/X11/fonts/Type1</dir>
	<dir>/usr/openwin/lib/X11/fonts/TTBitmaps</dir>
	<!-- Linux -->
	<dir>/usr/X11R6/lib/X11/fonts/TTF</dir>
	<dir>/usr/X11R6/lib/X11/fonts/Type1</dir>
	<dir>/usr/X11R6/lib/X11/fonts/OTF</dir>
	<dir>/usr/share/fonts</dir>


	<!-- Moved cache directory into OneSpin config directory
	     and include fontconfig version in the name
	     because of incompatibilities between fontconfig 2.4.2
	     and 1.6.99+ (see
		http://lists.freedesktop.org/archives/fontconfig/2009-June/003168.html
	     for the issue).
	-->

	<cachedir>~/.config/OneSpin/fontconfig-2.8.0-cache</cachedir>

<!--
  Accept deprecated 'mono' alias, replacing it with 'monospace'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>mono</string>
		</test>
		<edit name="family" mode="assign">
			<string>monospace</string>
		</edit>
	</match>

<!--
  Accept alternate 'sans serif' spelling, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans serif</string>
		</test>
		<edit name="family" mode="assign">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Accept deprecated 'sans' alias, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans</string>
		</test>
		<edit name="family" mode="assign">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Mark common families with their generics.
-->

        <alias>
		<family>Helvetica</family>
		<prefer>
			<family>Nimbus Sans L</family>
			<family>Luxi Sans</family>
			<family>Bitstream Vera Sans</family>
		</prefer>
		<default><family>sans-serif</family></default>
        </alias>

        <alias>
		<family>Courier</family>
		<prefer>
			<family>Courier New</family>
			<family>Luxi Mono</family>
			<family>Nimbus Mono L</family>
			<family>Bitstream Vera Sans Mono</family>
		</prefer>
		<default><family>monospace</family></default>
        </alias>

        <alias>
		<family>Times</family>
		<prefer>
			<family>Times New Roman</family>
			<family>Nimbus Roman No9 L</family>
			<family>Luxi Serif</family>
			<family>Bitstream Vera Serif</family>
		</prefer>
		<default><family>serif</family></default>
        </alias>


        <!--  Enable sub-pixel rendering
        <match target="font">
                <test qual="all" name="rgba">
                        <const>unknown</const>
                </test>
                <edit name="rgba" mode="assign"><const>rgb</const></edit>
        </match>
         -->

 <!--
  Provide required aliases for standard names
-->

       <alias>
                <family>serif</family>
                <prefer>
			<family>Times</family>
			<family>Times New Roman</family>
			<family>Nimbus Roman No9 L</family>
			<family>Luxi Serif</family>
			<family>Bitstream Vera Serif</family>
<!--			<family>TAB for BSV Serif</family>
-->
                </prefer>
        </alias>
        <alias>
                <family>sans-serif</family>
                <prefer>
			<family>Helvetica</family>
			<family>Nimbus Sans L</family>
			<family>Luxi Sans</family>
			<family>Bitstream Vera Sans</family>
<!--			<family>TAB for BSV</family>
-->
                </prefer>
        </alias>
        <alias>
                <family>monospace</family>
                <prefer>
			<family>Courier</family>
			<family>Courier New</family>
			<family>Luxi Mono</family>
			<family>Nimbus Mono L</family>
			<family>Bitstream Vera Sans Mono</family>
<!--			<family>TAB for BSV Mono</family>
-->
               </prefer>
        </alias>
</fontconfig>
